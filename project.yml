# XcodeGen spec. Generate the Xcode project with: xcodegen generate
name: MobiPad
options:
  # Bundle IDs must be unique, even for a free Personal Team. Change this if Xcode says it's taken.
  bundleIdPrefix: com.robertkarzijn.mobipad
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Your team ID (a free Personal Team works): Xcode → Settings → Accounts. Set it here,
    # because `xcodegen generate` overwrites a team picked in Xcode.
    # DEVELOPMENT_TEAM: XXXXXXXXXX

packages:
  MobiPadKit:
    path: MobiPadKit

targets:
  MobiPad:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: MobiPadKit
        product: MobiPadProtocol
      - package: MobiPadKit
        product: MobiPadNetwork
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1" # iPhone
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: MobiPad
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: MobiPad looks for your Mac on the local network so it can connect as a controller.
        NSBonjourServices:
          - _mobipad._udp # keep in sync with MobiPadService.bonjourType

  MobiPadCompanion:
    type: application
    platform: macOS
    sources: [macOS]
    dependencies:
      - package: MobiPadKit
        product: MobiPadProtocol
      - package: MobiPadKit
        product: MobiPadNetwork
      - package: MobiPadKit
        product: MobiPadDSU
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: MobiPad
        LSUIElement: true # menu bar only, no Dock icon
        NSLocalNetworkUsageDescription: MobiPad lets your iPhone find this Mac on the local network and connect as a controller.
        NSBonjourServices:
          - _mobipad._udp # keep in sync with MobiPadService.bonjourType
